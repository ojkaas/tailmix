name: checks

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - licenses/**
      - scripts/licenses.sh
      - scripts/windows/**
      - .github/workflows/checks.yml
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - licenses/**
      - scripts/licenses.sh
      - .github/workflows/checks.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The self-hosted runner only exists upstream; forks would queue forever.
    if: github.repository == 'maisem/tailmix'
    runs-on: [self-hosted, tailmix-vm]
    container:
      image: golang:1.27.1
    steps:
      - uses: actions/checkout@v6
      - run: make check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # GitHub-hosted runners are elevated, so named-pipe tests run too.
      - run: go test ./...
      - run: go build -ldflags "-H windowsgui" -o tailmix-tray.exe ./cmd/tailmix-tray
